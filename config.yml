# return straight to lazygit after `output: terminal` commands (diffsearch,
# neovide, git log -p) instead of "Press enter to return to lazygit"
# NOTE: this is a TOP-LEVEL key in lazygit >= 0.4x/0.65 (it was previously
# under os: — there it is silently ignored and the default `true` applies)
promptToReturnFromSubprocess: false
os:
  editPreset: nvim
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
theme:
  activeBorderColor:
    - '#8aadf4'
    - bold
  inactiveBorderColor:
    - '#a5adcb'
  optionsTextColor:
    - '#8aadf4'
  selectedLineBgColor:
    - '#363a4f'
  cherryPickedCommitBgColor:
    - '#494d64'
  cherryPickedCommitFgColor:
    - '#8aadf4'
  unstagedChangesColor:
    - '#ed8796'
  defaultFgColor:
    - '#cad3f5'
  searchingActiveBorderColor:
    - '#eed49f'
customCommands:
  - key: '<c-w>'
    description: 'Create new worktree with branch'
    context: 'global'
    prompts:
      - type: 'input'
        title: 'Worktree/Branch name:'
        initialValue: ''
    command: 'git newwt "{{index .PromptResponses 0}}"'
    loadingText: 'Creating worktree...'
  - key: '<c-n>'
    description: 'Open neovide at git root'
    context: 'global'
    command: 'neovide --fork --no-tabs'
    loadingText: 'Opening neovide...'
    output: terminal
  - key: '<c-a>' # stagecoach-integration
    context: 'files'
    command: 'stagecoach'
    loadingText: 'Generating commit message…'
    output: 'none'
    description: 'stagecoach: AI commit'
  - key: '<c-a>' # stagecoach-integration (Branches)
    context: 'localBranches'
    command: 'stagecoach'
    loadingText: 'Generating commit message…'
    output: 'none'
    description: 'stagecoach: AI commit'
  - key: '<c-a>' # stagecoach-integration (Commits)
    context: 'commits'
    command: 'stagecoach'
    loadingText: 'Generating commit message…'
    output: 'none'
    description: 'stagecoach: AI commit'
  - key: '<c-v>' # git log -p -- <selected file>: full patch history of file
    # LESS= (empty) forces less to use the alternate screen: previous output is
    # wiped on exit — every open starts fresh with only the new file's log.
    context: 'files'
    command: 'git --no-pager log --color=always -p -- {{.SelectedPath | quote}} | delta | LESS= less -R'
    description: 'git log -p: file history'
    output: terminal
  - key: '<c-v>' # same, from a commit's file list (Log → Enter on commit)
    context: 'commitFiles'
    command: 'git --no-pager log --color=always -p -- {{.SelectedPath | quote}} | delta | LESS= less -R'
    description: 'git log -p: file history'
    output: terminal
  - key: '<c-s>' # diffsearch: full-screen regex search across uncommitted changes
    context: 'files'
    command: 'python3 "$HOME/.config/lazygit/diffsearch.py" --select {{.SelectedPath | quote}}'
    output: terminal
    description: 'diffsearch: search uncommitted changes'
keybinding:
  universal:
    prevTab: '-'
    nextTab: '='
  files:
    collapseAll: '['
    expandAll: ']'
  commits:
    moveUpCommit: '<a-k>'
    moveDownCommit: '<a-j>'
